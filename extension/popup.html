<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Followthroo for LinkedIn</title>
    <style>
      /* The popup is a browser surface rather than a page we are injected into,
         so here `prefers-color-scheme` IS the right signal — unlike the content
         script, which has to read LinkedIn's own theme. */
      :root {
        --surface:#ffffff; --raised:#ffffff; --ink:#0a0a0a; --soft:#5b5b66;
        --line:#e3e3e6; --accent:#4b31e6; --on-accent:#ffffff;
        --tint:#f3f1fe; --ok:#0f7b52; --err:#b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface:#17171c; --raised:#1f1f26; --ink:#e8e8ea; --soft:#9a9aa4;
          --line:rgba(255,255,255,.13); --accent:#8b7bff; --on-accent:#0a0a0a;
          --tint:rgba(139,123,255,.15); --ok:#4ade80; --err:#f87171;
        }
      }
      * { box-sizing:border-box; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
      body { width:340px; margin:0; padding:16px; color:var(--ink); background:var(--surface); }

      /* One clear hierarchy: who we are, then the state, then the one action. */
      .head { display:flex; align-items:center; gap:9px; margin:0 0 3px; }
      .mark { width:22px; height:22px; border-radius:7px; background:var(--accent);
        color:var(--on-accent); display:grid; place-items:center; font-size:12px; font-weight:800; flex:0 0 auto; }
      h1 { font-size:14px; font-weight:700; margin:0; letter-spacing:-.01em; }
      .dot { width:9px; height:9px; border-radius:999px; background:var(--soft);
        display:inline-block; flex:0 0 auto; margin-left:auto; }
      .dot.on { background:var(--ok); }
      .dot.err { background:var(--err); }
      .sub { font-size:11.5px; color:var(--soft); margin:0 0 14px; line-height:1.5; }

      .status { margin:0 0 12px; padding:10px 11px; border-radius:9px; background:var(--tint);
        font-size:12px; line-height:1.5; }
      .muted { color:var(--soft); font-size:11px; }
      .row { display:flex; gap:8px; }
      button { flex:1; border:0; border-radius:9px; padding:10px 12px; font-size:12.5px;
        font-weight:600; cursor:pointer; transition:filter .15s ease, background .15s ease; }
      button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      .toggle { background:var(--line); color:var(--ink); }
      .toggle.on { background:var(--accent); color:var(--on-accent); }
      .toggle.on:hover { filter:brightness(1.08); }
      .ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
      .ghost:hover { background:var(--tint); }

      /* Reading progress — shown only while a scrape is actually running. */
      .reading { display:none; margin:0 0 12px; padding:11px 12px; border-radius:11px;
        border:1px solid var(--line); background:var(--raised); }
      .reading .label { font-size:12px; font-weight:600; margin:0 0 7px; }
      .bar { height:4px; border-radius:999px; background:var(--line); overflow:hidden; }
      .bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .4s ease; }
      .foot { margin:13px 0 0; font-size:10.5px; color:var(--soft); line-height:1.55; text-align:center; }
      a { color:var(--accent); }
      /* Which build is running. Chrome keeps serving an old content script to tabs
         that were already open when the extension reloaded, so without this a
         fixed bug can look unfixed with nothing on screen to say otherwise. */
      .ver { display:inline-block; margin-top:5px; opacity:.65; letter-spacing:.03em; }
    </style>
  </head>
  <body>
    <div class="head">
      <span class="mark">F</span>
      <h1>Followthroo for LinkedIn</h1>
      <span class="dot" id="dot" title="Connection status"></span>
    </div>
    <p class="sub" id="sub">Finds people on LinkedIn and saves them into your CRM.</p>

    <div class="reading" id="reading">
      <p class="label" id="readingLabel">Reading LinkedIn…</p>
      <div class="bar"><i id="readingBar"></i></div>
      <p class="muted" id="readingCount" style="margin:6px 0 0"></p>
    </div>

    <div class="status" id="status">Not connected.</div>

    <div class="row">
      <button class="toggle" id="toggle">Start</button>
      <button class="ghost" id="settings">Settings</button>
    </div>

    <p class="foot">
      Reads only, in your own logged-in LinkedIn tab. We never store your password
      or session. Connection requests are sent by the Followthroo desktop app.
      <br /><span id="ver" class="ver"></span>
    </p>

    <script src="popup.js"></script>
  </body>
</html>
